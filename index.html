<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessment Monitoring Calendar · Provincial Training Center – Calumpit</title>
<style>
/* ============================================================
   BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  background: #eef2f7;
  color: #0f172a;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
h1, h2, h3, h4 { margin: 0; }

/* ============================================================
   HEADER
   ============================================================ */
.app-header {
  background: linear-gradient(120deg, #0b1220 0%, #132a3f 55%, #0d3b33 100%);
  color: #f8fafc;
  padding: 12px 22px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 22px;
  border-bottom: 3px solid #059669;
}
.brand { display: flex; align-items: center; gap: 13px; }
.logo {
  width: 44px; height: 44px; border-radius: 12px; flex: none;
  background: linear-gradient(135deg, #059669, #0284c7);
  display: grid; place-items: center;
  font-weight: 800; font-size: 14px; letter-spacing: .5px; color: #fff;
  box-shadow: 0 4px 14px rgba(5,150,105,.38);
}
.brand h1 { font-size: 16px; font-weight: 800; letter-spacing: .2px; }
.brand p { margin: 2px 0 0; font-size: 12px; color: #94a3b8; font-weight: 600; }
.header-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid transparent; border-radius: 9px;
  padding: 8px 13px; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: .16s ease; white-space: nowrap;
  background: #fff; color: #0f172a;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.app-header .btn {
  background: rgba(255,255,255,.10); color: #f1f5f9;
  border-color: rgba(255,255,255,.20);
}
.app-header .btn:hover { background: rgba(255,255,255,.22); }
.app-header .btn-accent { background: #059669; border-color: #059669; color: #fff; }
.app-header .btn-accent:hover { background: #047857; }
.btn-primary { background: #059669; color: #fff; border-color: #059669; }
.btn-primary:hover { background: #047857; }
.btn-danger { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
.btn-danger:hover { background: #fecaca; }
.btn-ghost { background: #f8fafc; color: #475569; border-color: #e2e8f0; }
.btn-ghost:hover { background: #f1f5f9; }
.btn:disabled, .icon-btn:disabled { opacity: .42; cursor: not-allowed; transform: none; }

.icon-btn {
  width: 33px; height: 33px; border-radius: 8px;
  border: 1px solid #e2e8f0; background: #fff; cursor: pointer;
  font-size: 14px; line-height: 1; display: grid; place-items: center;
  color: #475569; transition: .16s ease;
}
.icon-btn:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
.icon-btn.danger:hover { background: #fee2e2; border-color: #fecaca; color: #b91c1c; }

/* ============================================================
   TABS
   ============================================================ */
.tabbar {
  display: flex; gap: 2px; background: #fff;
  border-bottom: 1px solid #e2e8f0; padding: 0 18px;
  position: sticky; top: 0; z-index: 40;
  box-shadow: 0 1px 3px rgba(15,23,42,.05);
  overflow-x: auto;
}
.tabbar button {
  border: 0; background: transparent; padding: 13px 16px;
  font-size: 13px; font-weight: 700; color: #64748b;
  cursor: pointer; border-bottom: 3px solid transparent;
  transition: .15s; display: inline-flex; align-items: center; gap: 7px;
  white-space: nowrap;
}
.tabbar button:hover { color: #0f172a; background: #f8fafc; }
.tabbar button.active { color: #047857; border-bottom-color: #059669; }

/* ============================================================
   LAYOUT
   ============================================================ */
.page { max-width: 1560px; margin: 0 auto; padding: 16px 22px 70px; }

.toolbar {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
  padding: 11px 14px; display: flex; flex-wrap: wrap; gap: 10px 12px;
  align-items: center; box-shadow: 0 1px 2px rgba(15,23,42,.05);
  margin-bottom: 10px;
}
.toolbar.filters-bar { margin-bottom: 14px; }

.segmented { display: inline-flex; background: #f1f5f9; border-radius: 10px; padding: 3px; gap: 2px; }
.segmented button {
  border: 0; background: transparent; padding: 7px 15px; border-radius: 8px;
  font-weight: 700; font-size: 13px; color: #64748b; cursor: pointer; transition: .15s;
}
.segmented button:hover { color: #0f172a; }
.segmented button.active { background: #fff; color: #0f172a; box-shadow: 0 1px 3px rgba(15,23,42,.14); }

.datenav { display: flex; align-items: center; gap: 6px; }
.period-label { font-weight: 800; font-size: 14.5px; min-width: 180px; text-align: center; color: #0f172a; }

.stats {
  font-size: 12px; font-weight: 700; color: #047857;
  background: #ecfdf5; border: 1px solid #a7f3d0;
  padding: 6px 11px; border-radius: 999px; white-space: nowrap;
}
.save-state {
  font-size: 11.5px; font-weight: 800; color: #94a3b8;
  display: inline-flex; align-items: center; gap: 5px;
  transition: color .2s;
}
.save-state.on { color: #059669; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; align-items: center; }

select, input[type="text"], input[type="date"],
input[type="number"], input[type="search"], textarea {
  font: inherit; font-size: 13px; padding: 8px 10px;
  border: 1px solid #cbd5e1; border-radius: 9px; background: #fff;
  color: #0f172a; min-width: 0; transition: .15s;
}
select:focus, input:focus, textarea:focus {
  outline: 2px solid #a7f3d0; outline-offset: 0; border-color: #059669;
}
textarea { resize: vertical; }
.search-box { position: relative; flex: 1 1 220px; min-width: 180px; }
.search-box input { width: 100%; padding-left: 32px; }
.search-box::before {
  content: "🔍"; position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%); font-size: 12px; opacity: .6; pointer-events: none;
}
.filters select, .filters input { max-width: 210px; }

/* ============================================================
   LEGEND
   ============================================================ */
.legend {
  display: flex; flex-wrap: wrap; gap: 9px 22px;
  background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
  padding: 10px 14px; margin-bottom: 14px; font-size: 12px;
}
.legend-group { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.legend-title {
  font-weight: 800; color: #475569; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: .07em;
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; color: #334155; font-weight: 600; }
.swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }

/* ============================================================
   CALENDAR — MONTH
   ============================================================ */
.cal-card {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
  overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.05);
}
.cal-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: #f8fafc; border-bottom: 1px solid #e2e8f0;
}
.cal-weekdays div {
  padding: 9px 8px; font-size: 11.5px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .05em; color: #64748b; text-align: center;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(132px, 1fr); }
.cal-cell {
  border-right: 1px solid #eef2f7; border-bottom: 1px solid #eef2f7;
  padding: 6px; display: flex; flex-direction: column; gap: 4px;
  min-height: 132px; cursor: pointer; transition: background .12s; overflow: hidden;
}
.cal-cell:nth-child(7n) { border-right: 0; }
.cal-cell:hover { background: #f8fafc; }
.cal-cell.is-out { background: #fbfcfe; }
.cal-cell.is-out .cal-daynum { color: #cbd5e1; }
.cal-daynum {
  font-size: 11.5px; font-weight: 800; color: #64748b;
  display: flex; align-items: center; justify-content: flex-end;
  padding: 1px 2px; min-height: 22px;
}
.cal-cell.is-today .cal-daynum {
  justify-content: center; background: #059669; color: #fff;
  border-radius: 6px; width: 22px; height: 22px; margin-left: auto; padding: 0;
}
.cal-events { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.cal-more { font-size: 10px; color: #64748b; font-weight: 800; padding-left: 5px; }

.chip {
  display: flex; gap: 5px; align-items: flex-start; width: 100%; text-align: left;
  border: 0; border-left: 3px solid #64748b; border-radius: 6px;
  padding: 3px 6px; font-size: 10.5px; font-weight: 700;
  cursor: pointer; overflow: hidden; line-height: 1.25; transition: .12s;
}
.chip:hover { filter: brightness(.96); }
.chip-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-top: 4px; }
.chip-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.chip-line1 {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-weight: 800;
}
.chip-line2 {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 9.5px; font-weight: 600; opacity: .82;
}

/* ============================================================
   WEEK
   ============================================================ */
.week-wrap { overflow-x: auto; padding-bottom: 4px; }
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; min-width: 880px; }
.week-col {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
  padding: 8px; min-height: 240px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 1px 2px rgba(15,23,42,.05);
}
.week-col.is-today { border-color: #059669; box-shadow: 0 0 0 2px #d1fae5; }
.week-col-head {
  font-size: 12px; font-weight: 800; color: #334155;
  border-bottom: 1px solid #eef2f7; padding-bottom: 6px; text-align: center;
}
.week-col-head span {
  display: block; font-size: 10.5px; font-weight: 700;
  color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px;
}
.week-empty { color: #cbd5e1; font-size: 12px; text-align: center; padding: 12px 0; font-weight: 700; }

/* ============================================================
   EVENT CARD
   ============================================================ */
.ev-card {
  border: 1px solid rgba(15,23,42,.08); border-left: 4px solid #64748b;
  border-radius: 9px; padding: 7px 9px; font-size: 11.5px;
  cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  text-align: left; width: 100%; color: inherit; transition: .15s;
}
.ev-card:hover { box-shadow: 0 3px 10px rgba(15,23,42,.13); transform: translateY(-1px); }
.ev-top { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.badge {
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
  color: #fff; padding: 2px 6px; border-radius: 999px; white-space: nowrap;
}
.ev-qual { font-weight: 800; font-size: 11.5px; color: #0f172a; line-height: 1.25; }
.ev-meta { font-size: 10.5px; color: #475569; font-weight: 600; }
.ev-foot { display: flex; gap: 5px; margin-top: 2px; }

.pill {
  display: inline-block; font-size: 9.5px; font-weight: 800;
  padding: 2px 8px; border-radius: 999px; letter-spacing: .03em;
  text-transform: uppercase; white-space: nowrap;
}

/* ============================================================
   DAY VIEW
   ============================================================ */
.day-grid {
  display: grid; gap: 12px; padding: 14px;
  grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
}
.day-grid .ev-card { padding: 12px; font-size: 12.5px; gap: 5px; }
.day-grid .ev-qual { font-size: 13px; }
.day-grid .ev-meta { font-size: 11.5px; }

/* ============================================================
   PANELS / TABLES
   ============================================================ */
.panel {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
  overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.05); margin-bottom: 16px;
}
.panel-head {
  padding: 12px 16px; border-bottom: 1px solid #eef2f7;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.panel-head h3 { font-size: 13.5px; font-weight: 800; }
.panel-head .sub { font-size: 11.5px; color: #94a3b8; font-weight: 700; }
.panel-head select { padding: 5px 9px; font-size: 12px; font-weight: 800; }
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th {
  background: #f8fafc; text-align: left; padding: 9px 12px;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
  color: #64748b; border-bottom: 1px solid #e2e8f0; white-space: nowrap;
}
table.data th.sortable { cursor: pointer; user-select: none; }
table.data th.sortable:hover { background: #f1f5f9; color: #0f172a; }
table.data td { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
table.data tbody tr:hover { background: #f8fafc; }
table.data tfoot td { font-weight: 800; background: #f8fafc; border-top: 2px solid #e2e8f0; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.remarks { max-width: 220px; color: #64748b; font-size: 11.5px; }
.actions { display: flex; gap: 5px; }
.dot-badge {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}
.q-tag {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  border-left: 3px solid #64748b; font-size: 11px; font-weight: 800;
  white-space: nowrap;
}
.now-badge {
  display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .05em;
  color: #059669; margin-left: 6px; padding: 1px 5px; border-radius: 4px;
  background: #d1fae5; vertical-align: middle;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
.stat-grid {
  display: grid; gap: 12px; margin-bottom: 16px;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
}
.stat-card {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
  padding: 14px 16px; box-shadow: 0 1px 2px rgba(15,23,42,.05);
  border-top: 3px solid #e2e8f0;
}
.stat-card .k {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  font-weight: 800; color: #64748b;
}
.stat-card .v { font-size: 27px; font-weight: 800; margin-top: 6px; letter-spacing: -.6px; line-height: 1; }
.stat-card .s { font-size: 11.5px; color: #94a3b8; font-weight: 600; margin-top: 5px; }

.bar-track { height: 6px; background: #f1f5f9; border-radius: 999px; overflow: hidden; margin-top: 6px; }
.bar-fill { height: 100%; border-radius: 999px; }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty { padding: 54px 20px; text-align: center; color: #64748b; font-size: 13.5px; font-weight: 600; }
.empty strong { display: block; color: #0f172a; font-size: 15px; margin-bottom: 6px; }

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,.55);
  display: flex; align-items: center; justify-content: center;
  padding: 18px; z-index: 60; backdrop-filter: blur(2px);
}
.modal-overlay[hidden] { display: none; }
.modal {
  background: #fff; border-radius: 16px; width: min(620px, 100%);
  max-height: 92vh; overflow: auto; padding: 22px 24px;
  box-shadow: 0 24px 60px rgba(15,23,42,.35);
  animation: pop .18s ease-out;
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal h2 { margin-bottom: 18px; font-size: 17px; font-weight: 800; letter-spacing: .1px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
.field label {
  font-size: 10.5px; font-weight: 800; color: #475569;
  text-transform: uppercase; letter-spacing: .05em;
}
.field input, .field select, .field textarea { width: 100%; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions {
  display: flex; gap: 8px; align-items: center;
  margin-top: 18px; padding-top: 16px; border-top: 1px solid #eef2f7;
}
.modal-actions .spacer { flex: 1; }

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
  background: #0f172a; color: #f8fafc; padding: 11px 19px; border-radius: 10px;
  font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none;
  transition: .25s ease; z-index: 90; box-shadow: 0 10px 30px rgba(15,23,42,.35);
  max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ============================================================
   PRINT
   ============================================================ */
.print-only { display: none; }

@media print {
  @page { size: A4 landscape; margin: 8mm; }

  html, body { background: #fff !important; }
  .no-print { display: none !important; }
  .print-only { display: block !important; }
  .page { max-width: none; padding: 0; margin: 0; }
  .app-header, .tabbar, .toolbar { display: none !important; }

  .print-head {
    margin-bottom: 8px; border-bottom: 2px solid #059669; padding-bottom: 6px;
  }
  .print-head h1 { font-size: 14pt; letter-spacing: .2px; text-transform: uppercase; }
  .print-head h2 { font-size: 11pt; font-weight: 700; color: #334155; margin-top: 2px; }
  .print-head p { margin: 3px 0 0; font-size: 8.5pt; color: #334155; font-weight: 600; }

  .legend {
    border: 1px solid #cbd5e1; border-radius: 0; padding: 5px 8px;
    margin-bottom: 6px; font-size: 6.8pt; gap: 3px 12px;
  }
  .legend-title { font-size: 6.5pt; }
  .swatch { width: 8px; height: 8px; }

  .cal-card { border: 1px solid #94a3b8; border-radius: 0; box-shadow: none; }
  .cal-weekdays { background: #f1f5f9 !important; }
  .cal-weekdays div { font-size: 7.5pt; padding: 4px 2px; }
  .cal-grid { grid-auto-rows: auto; }
  .cal-cell {
    min-height: 21mm; page-break-inside: avoid; break-inside: avoid;
    border-color: #cbd5e1 !important; cursor: default;
  }
  .cal-cell:hover { background: transparent !important; }
  .cal-cell.is-out { background: #fafafa !important; }
  .cal-daynum { font-size: 8pt; min-height: 0; }
  .cal-cell.is-today .cal-daynum { background: #059669 !important; color: #fff !important; }

  .chip { font-size: 6.8pt; padding: 1.5px 4px; border-radius: 3px; }
  .chip-line1, .chip-line2 { white-space: normal; overflow: visible; text-overflow: clip; }
  .chip-line2 { font-size: 6pt; }
  .chip-dot { width: 4px; height: 4px; margin-top: 3px; }
  .cal-more { font-size: 6.5pt; }

  .week-wrap { overflow: visible; }
  .week-grid { min-width: 0; gap: 4px; grid-template-columns: repeat(7, 1fr); }
  .week-col { box-shadow: none; padding: 4px; min-height: 30mm; }
  .ev-card {
    font-size: 7pt; padding: 3px 4px; box-shadow: none !important; transform: none !important;
    page-break-inside: avoid; break-inside: avoid;
  }
  .ev-qual { font-size: 7pt; }
  .ev-meta, .badge, .pill { font-size: 6.4pt; }

  .panel { border: 1px solid #94a3b8; border-radius: 0; box-shadow: none; page-break-inside: avoid; }
  table.data { font-size: 7.5pt; }
  table.data th { font-size: 6.8pt; padding: 3px 5px; }
  table.data td { padding: 3px 5px; }
  .stat-grid { grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .stat-card { border-radius: 0; padding: 6px 8px; }
  .stat-card .v { font-size: 14pt; }
  .stat-card .k, .stat-card .s { font-size: 6.5pt; }

  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 980px) {
  .page { padding: 14px 12px 60px; }
  .period-label { min-width: 135px; font-size: 13px; }
  .filters { margin-left: 0; width: 100%; }
  .filters select, .filters input { flex: 1 1 150px; max-width: none; }
  .search-box { flex: 1 1 100%; }
  .cal-cell { min-height: 100px; padding: 4px; }
  .cal-grid { grid-auto-rows: minmax(100px, 1fr); }
  .cal-weekdays div { font-size: 9.5px; padding: 7px 2px; }
  .chip { font-size: 9.5px; }
  .chip-line2 { font-size: 8.5px; }
  .field-row { grid-template-columns: 1fr; }
}
@media (max-width: 620px) {
  .brand h1 { font-size: 14px; }
  .header-actions { width: 100%; margin-left: 0; }
  .header-actions .btn { flex: 1 1 auto; justify-content: center; }
  .segmented { width: 100%; }
  .segmented button { flex: 1; }
  .period-label { min-width: 110px; }
  .stats { order: 5; }
}
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="app-header no-print">
  <div class="brand">
    <div class="logo">PTC</div>
    <div>
      <h1>Assessment Monitoring Calendar</h1>
      <p>Provincial Training Center – Calumpit</p>
    </div>
  </div>
  <div class="header-actions">

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* =========================================================
     1. CONSTANTS
     ========================================================= */
  const STORAGE_KEY = "ptc-calumpit-assessments-v3";

  const SCHOLARSHIPS = [
    { name: "Scholarship", color: "#2563eb" },
    { name: "Regular",     color: "#16a34a" },
    { name: "CAWC",        color: "#ea580c" },
    { name: "Walk-in",     color: "#7c3aed" }
  ];

  const QUALIFICATIONS = [
    { short: "EIM NC II",        name: "Electrical Installation and Maintenance NC II",  color: "#2563eb", bg: "#dbeafe", text: "#1e40af" },
    { short: "EIM NC III",       name: "Electrical Installation and Maintenance NC III", color: "#1e3a8a", bg: "#e0e7ff", text: "#1e3a8a" },
    { short: "SMAW NC I",        name: "Shielded Metal Arc Welding NC I",                color: "#dc2626", bg: "#fee2e2", text: "#991b1b" },
    { short: "SMAW NC II",       name: "Shielded Metal Arc Welding NC II",               color: "#b91c1c", bg: "#fecaca", text: "#7f1d1d" },
    { short: "SMAW NC III",      name: "Shielded Metal Arc Welding NC III",              color: "#7f1d1d", bg: "#ffe4e6", text: "#7f1d1d" },
    { short: "PV NC II",         name: "Photovoltaic Systems Installation NC II",        color: "#eab308", bg: "#fef9c3", text: "#854d0e" },
    { short: "Dressmaking NC II",name: "Dressmaking NC II",                              color: "#db2777", bg: "#fce7f3", text: "#9d174d" },
    { short: "Driving NC II",    name: "Driving NC II",                                  color: "#0d9488", bg: "#ccfbf1", text: "#115e59" },
    { short: "BHS NC II",        name: "Barangay Health Services NC II",                 color: "#16a34a", bg: "#dcfce7", text: "#166534" },
    { short: "TM Level I",       name: "Trainers Methodology Level I",                   color: "#7c3aed", bg: "#ede9fe", text: "#5b21b6" }
  ];

  const STATUSES = [
    { name: "Scheduled", color: "#0284c7", bg: "#e0f2fe" },
    { name: "Ongoing",   color: "#d97706", bg: "#fef3c7" },
    { name: "Completed", color: "#059669", bg: "#d1fae5" },
    { name: "Cancelled", color: "#dc2626", bg: "#fee2e2" }
  ];

  const MONTHS = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];

  /* =========================================================
     2. HELPERS
     ========================================================= */
  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const pad = n => String(n).padStart(2, "0");

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }
  function uid() {
    return Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
  }
  const schol = n => SCHOLARSHIPS.find(s => s.name === n) || { name: n || "—", color: "#64748b" };
  const qual  = n => QUALIFICATIONS.find(q => q.name === n) ||
    { short: n || "—", name: n || "—", color: "#64748b", bg: "#f1f5f9", text: "#334155" };
  const stat  = n => STATUSES.find(s => s.name === n) || STATUSES[0];

  /* ---------- date helpers ---------- */
  function toKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function keyToDate(k) { const p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function startOfWeek(d) {
    const s = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    s.setDate(s.getDate() - s.getDay());
    return s;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }

  function fmtDateLong(k) {
    return keyToDate(k).toLocaleDateString("en-US", {
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    });
  }
  function fmtDateShort(k) {
    return keyToDate(k).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }

  /* =========================================================
     3. STATE
     ========================================================= */
  const state = {
    tab: "calendar",
    view: "month",
    cursor: new Date(),
    reportYear: new Date().getFullYear(),
    printMode: false,
    filters: { scholarship: "", qualification: "", assessor: "", status: "", from: "", to: "", q: "" },
    sort: { key: "date", dir: 1 },
    events: []
  };
  let editingId = null;
  let toastTimer = null;

  /* =========================================================
     4. PERSISTENCE
     ========================================================= */
  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.events));
      flashSaved();
    } catch (err) {
      console.warn("Unable to persist data:", err);
      toast("⚠ Unable to save — browser storage may be full.");
    }
  }
  function flashSaved() {
    const el = $("#saveState");
    if (!el) return;
    el.textContent = "✓ Saved";
    el.classList.add("on");
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(() => el.classList.remove("on"), 1800);
  }
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (err) { console.warn("Unable to read stored data:", err); }
    return [];
  }

  /* =========================================================
     5. FILTERING / GROUPING / SORTING
     ========================================================= */
  function filteredEvents() {
    const f = state.filters;
    const q = (f.q || "").trim().toLowerCase();

    return state.events.filter(e => {
      if (f.scholarship && e.scholarship !== f.scholarship) return false;
      if (f.qualification && e.qualification !== f.qualification) return false;
      if (f.assessor && e.assessor !== f.assessor) return false;
      if (f.status && e.status !== f.status) return false;
      if (f.from && e.date < f.from) return false;
      if (f.to && e.date > f.to) return false;
      if (q) {
        const hay = [
          e.assessor, e.qualification, e.scholarship, e.date,
          e.remarks, e.status
        ].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function groupByDay(evs) {
    const g = {};
    evs.forEach(e => { (g[e.date] = g[e.date] || []).push(e); });
    Object.keys(g).forEach(k => g[k].sort((a, b) =>
      (a.assessor || "").localeCompare(b.assessor || "")));
    return g;
  }

  function sortEvents(evs) {
    const s = state.sort;
    const copy = evs.slice();
    copy.sort((a, b) => {
      let av, bv;
      switch (s.key) {
        case "date": av = a.date; bv = b.date; break;
        case "scholarship": av = a.scholarship; bv = b.scholarship; break;
        case "qualification": av = a.qualification; bv = b.qualification; break;
        case "assessor": av = (a.assessor || "").toLowerCase(); bv = (b.assessor || "").toLowerCase(); break;
        case "candidates": av = Number(a.candidates) || 0; bv = Number(b.candidates) || 0; break;
        case "status": av = a.status; bv = b.status; break;
        default: av = a.date; bv = b.date;
      }
      if (av < bv) return -1 * s.dir;
      if (av > bv) return 1 * s.dir;
      return 0;
    });
    return copy;
  }

  const sumCandidates = list => list.reduce((t, e) => t + (Number(e.candidates) || 0), 0);

  /* =========================================================
     6. MARKUP BUILDERS
     ========================================================= */
  function chipHTML(e) {
    const s = schol(e.scholarship), q = qual(e.qualification);
    const tip = [q.name, e.scholarship, e.assessor,
                 e.candidates + " candidate" + (Number(e.candidates) === 1 ? "" : "s"),
                 e.status].filter(Boolean).join(" · ");
    return `<button type="button" class="chip" data-id="${e.id}" title="${esc(tip)}"
      style="background:${q.bg};border-left-color:${q.color};color:${q.text}">
      <span class="chip-dot" style="background:${s.color}"></span>
      <span class="chip-body">
        <span class="chip-line1">${esc(q.short)} · ${e.candidates}</span>
        <span class="chip-line2">${esc(e.assessor || "—")}</span>
      </span>
    </button>`;
  }

  function cardHTML(e) {
    const s = schol(e.scholarship), q = qual(e.qualification), st = stat(e.status);
    return `<div class="ev-card" data-id="${e.id}" role="button" tabindex="0"
      style="background:${q.bg};border-left-color:${q.color}">
      <div class="ev-top">
        <span class="badge" style="background:${s.color}">${esc(e.scholarship)}</span>
      </div>
      <div class="ev-qual">${esc(q.name)}</div>
      <div class="ev-meta">${esc(e.assessor || "—")} · ${e.candidates} candidate${Number(e.candidates) === 1 ? "" : "s"}</div>
      <div class="ev-foot"><span class="pill" style="background:${st.bg};color:${st.color}">${esc(e.status)}</span></div>
    </div>`;
  }

  function emptyState(title, msg) {
    return `<div class="panel"><div class="empty"><strong>${esc(title)}</strong>${esc(msg)}</div></div>`;
  }

  /* =========================================================
     7. VIEW: MONTH
     ========================================================= */
  function buildMonthDays(cursor) {
    const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const start = new Date(first);
    start.setDate(1 - first.getDay());

    const last = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
    const end = new Date(last);
    end.setDate(last.getDate() + (6 - last.getDay()));

    const days = [];
    const walk = new Date(start);
    while (walk <= end) { days.push(new Date(walk)); walk.setDate(walk.getDate() + 1); }
    return days;
  }

  function renderMonth() {
    const days = buildMonthDays(state.cursor);
    const grouped = groupByDay(filteredEvents());
    const month = state.cursor.getMonth();
    const todayKey = toKey(new Date());
    const limit = state.printMode ? 999 : 2;

    let cells = "";
    days.forEach(d => {
      const key = toKey(d);
      const evs = grouped[key] || [];
      const cls = ["cal-cell"];
      if (d.getMonth() !== month) cls.push("is-out");
      if (key === todayKey) cls.push("is-today");

      const chips = evs.slice(0, limit).map(chipHTML).join("");
      const more = evs.length > limit
        ? `<div class="cal-more">+${evs.length - limit} more</div>` : "";

      cells += `<div class="${cls.join(" ")}" data-date="${key}" role="button" tabindex="0"
        aria-label="${esc(fmtDateLong(key))}, ${evs.length} assessment(s)">
        <div class="cal-daynum">${d.getDate()}</div>
        <div class="cal-events">${chips}${more}</div>
      </div>`;
    });

    const wd = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    return `<div class="cal-card">
      <div class="cal-weekdays">${wd.map(w => `<div>${w}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
    </div>`;
  }

  /* =========================================================
     8. VIEW: WEEK
     ========================================================= */
  function renderWeek() {
    const start = startOfWeek(state.cursor);
    const grouped = groupByDay(filteredEvents());
    const todayKey = toKey(new Date());
    let cols = "";

    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i);
      const key = toKey(d);
      const evs = grouped[key] || [];
      cols += `<div class="week-col${key === todayKey ? " is-today" : ""}">
        <div class="week-col-head">${d.toLocaleDateString("en-US", { weekday: "short" })}
          <span>${d.toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span>
        </div>
        ${evs.length ? evs.map(cardHTML).join("") : '<div class="week-empty">—</div>'}
      </div>`;
    }
    return `<div class="week-wrap"><div class="week-grid">${cols}</div></div>`;
  }

  /* =========================================================
     9. VIEW: DAY
     ========================================================= */
  function renderDay() {
    const key = toKey(state.cursor);
    const evs = filteredEvents()
      .filter(e => e.date === key)
      .sort((a, b) => (a.assessor || "").localeCompare(b.assessor || ""));
    const total = sumCandidates(evs);

    let body;
    if (!evs.length) {
      body = `<div class="empty"><strong>No assessments scheduled</strong>
        Click “Add Assessment” to schedule one for this day.</div>`;
    } else {
      body = `<div class="day-grid">${evs.map(cardHTML).join("")}</div>`;
    }

    return `<div class="panel">
      <div class="panel-head">
        <h3>${esc(fmtDateLong(key))}</h3>
        <span class="sub">${evs.length} batch${evs.length === 1 ? "" : "es"} · ${total} candidate${total === 1 ? "" : "s"}</span>
        <button class="btn btn-primary" type="button" data-new="${key}" style="margin-left:auto">＋ Add Assessment</button>
      </div>
      ${body}
    </div>`;
  }

  /* =========================================================
     10. VIEW: LIST
     ========================================================= */
  function sortTh(key, label, extraClass) {
    const arrow = state.sort.key === key ? (state.sort.dir > 0 ? " ▲" : " ▼") : "";
    return `<th class="sortable ${extraClass || ""}" data-sort="${key}">${label}${arrow}</th>`;
  }

  function renderList() {
    const evs = sortEvents(filteredEvents());
    if (!evs.length) {
      return emptyState("No assessments found",
        "Adjust your filters or add a new assessment entry to get started.");
    }
    const total = sumCandidates(evs);

    const rows = evs.map(e => {
      const s = schol(e.scholarship), q = qual(e.qualification), st = stat(e.status);
      return `<tr>
        <td class="nowrap">${esc(fmtDateShort(e.date))}</td>
        <td class="nowrap"><span class="dot-badge" style="background:${s.color}"></span>${esc(e.scholarship)}</td>
        <td><span class="q-tag" style="background:${q.bg};color:${q.text};border-color:${q.color}">${esc(q.short)}</span></td>
        <td>${esc(e.assessor || "—")}</td>
        <td class="num">${e.candidates}</td>
        <td class="nowrap"><span class="pill" style="background:${st.bg};color:${st.color}">${esc(e.status)}</span></td>
        <td class="remarks">${esc(e.remarks || "")}</td>
        <td class="actions nowrap">
          <button class="icon-btn" type="button" data-id="${e.id}" title="Edit">✎</button>
          <button class="icon-btn danger" type="button" data-del="${e.id}" title="Delete">🗑</button>
        </td>
      </tr>`;
    }).join("");

    return `<div class="panel">
      <div class="panel-head">
        <h3>All Scheduled Assessments</h3>
        <span class="sub">${evs.length} batch${evs.length === 1 ? "" : "es"} · ${total} candidates</span>
      </div>
      <div class="table-wrap">
        <table class="data">
          <thead><tr>
            ${sortTh("date", "Date")}
            ${sortTh("scholarship", "Scholarship")}
            ${sortTh("qualification", "Qualification")}
            ${sortTh("assessor", "Assessor")}
            ${sortTh("candidates", "Candidates", "num")}
            ${sortTh("status", "Status")}
            <th>Remarks</th>
            <th>Actions</th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr>
            <td colspan="4">TOTAL</td>
            <td class="num">${total}</td>
            <td colspan="3"></td>
          </tr></tfoot>
        </table>
      </div>
    </div>`;
  }

  /* =========================================================
     11. DASHBOARD
     ========================================================= */
  function renderDashboard() {
    const evs = filteredEvents();
    const totalCand = sumCandidates(evs);

    const byStatus = {};
    STATUSES.forEach(s => byStatus[s.name] = 0);
    evs.forEach(e => { if (byStatus[e.status] != null) byStatus[e.status]++; });

    const schStats = SCHOLARSHIPS.map(s => {
      const list = evs.filter(e => e.scholarship === s.name);
      return { name: s.name, color: s.color, batches: list.length, cand: sumCandidates(list) };
    });

    const qualStats = QUALIFICATIONS.map(q => {
      const list = evs.filter(e => e.qualification === q.name);
      return { q, batches: list.length, cand: sumCandidates(list) };
    }).filter(x => x.batches > 0).sort((a, b) => b.cand - a.cand);

    const assessorMap = {};
    evs.forEach(e => {
      const k = e.assessor || "Unassigned";
      if (!assessorMap[k]) assessorMap[k] = { name: k, batches: 0, cand: 0, done: 0 };
      assessorMap[k].batches++;
      assessorMap[k].cand += Number(e.candidates) || 0;
      if (e.status === "Completed") assessorMap[k].done++;
    });
    const assessors = Object.values(assessorMap).sort((a, b) => b.cand - a.cand);
    const maxCand = Math.max(1, ...assessors.map(a => a.cand));

    const statCard = (label, value, sub, color) => `
      <div class="stat-card" style="border-top-color:${color || "#e2e8f0"}">
        <div class="k">${esc(label)}</div>
        <div class="v">${value}</div>
        <div class="s">${esc(sub || "")}</div>
      </div>`;

    let html = `<div class="stat-grid">
      ${statCard("Total Assessments", evs.length, "scheduled batches", "#059669")}
      ${statCard("Total Candidates", totalCand, "across all batches", "#0284c7")}
      ${statCard("Completed", byStatus["Completed"], "finished assessments", "#059669")}
      ${statCard("Ongoing", byStatus["Ongoing"], "in progress", "#d97706")}
      ${statCard("Scheduled", byStatus["Scheduled"], "upcoming", "#0284c7")}
      ${statCard("Cancelled", byStatus["Cancelled"], "cancelled batches", "#dc2626")}
    </div>`;

    html += `<div class="panel">
      <div class="panel-head"><h3>Breakdown by Scholarship Type</h3></div>
      <div class="table-wrap"><table class="data">
        <thead><tr><th>Scholarship Type</th><th class="num">Batches</th><th class="num">Candidates</th><th class="num">Share</th></tr></thead>
        <tbody>${schStats.map(s => `<tr>
          <td><span class="dot-badge" style="background:${s.color}"></span><strong>${esc(s.name)}</strong></td>
          <td class="num">${s.batches}</td>
          <td class="num">${s.cand}</td>
          <td class="num">${totalCand ? Math.round(s.cand / totalCand * 100) : 0}%</td>
        </tr>`).join("")}</tbody>
        <tfoot><tr>
          <td>TOTAL</td>
          <td class="num">${evs.length}</td>
          <td class="num">${totalCand}</td>
          <td class="num">100%</td>
        </tr></tfoot>
      </table></div>
    </div>`;

    html += `<div class="panel">
      <div class="panel-head"><h3>Assessments per Qualification</h3></div>
      <div class="table-wrap"><table class="data">
        <thead><tr><th>Qualification Program</th><th class="num">Batches</th><th class="num">Candidates</th></tr></thead>
        <tbody>${qualStats.length ? qualStats.map(x => `<tr>
          <td><span class="q-tag" style="background:${x.q.bg};color:${x.q.text};border-color:${x.q.color}">${esc(x.q.short)}</span>
            <span style="color:#64748b;font-size:11.5px;margin-left:8px">${esc(x.q.name)}</span></td>
          <td class="num">${x.batches}</td>
          <td class="num">${x.cand}</td>
        </tr>`).join("") : `<tr><td colspan="3" style="color:#94a3b8">No data for the current filters.</td></tr>`}</tbody>
      </table></div>
    </div>`;

    html += `<div class="panel">
      <div class="panel-head"><h3>Assessor Workload</h3><span class="sub">batches &amp; candidates assigned</span></div>
      <div class="table-wrap"><table class="data">
        <thead><tr><th>Assessor</th><th class="num">Batches</th><th class="num">Candidates</th><th class="num">Completed</th><th>Load</th></tr></thead>
        <tbody>${assessors.length ? assessors.map(a => `<tr>
          <td><strong>${esc(a.name)}</strong></td>
          <td class="num">${a.batches}</td>
          <td class="num">${a.cand}</td>
          <td class="num">${a.done}</td>
          <td style="min-width:130px">
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(a.cand / maxCand * 100)}%;background:#059669"></div></div>
          </td>
        </tr>`).join("") : `<tr><td colspan="5" style="color:#94a3b8">No assessors match the current filters.</td></tr>`}</tbody>
      </table></div>
    </div>`;

    html += renderYearlyReport();

    return html;
  }

  /* =========================================================
     12. YEARLY REPORT
     ========================================================= */
  function renderYearlyReport() {
    const year = state.reportYear;

    const years = new Set();
    years.add(new Date().getFullYear());
    years.add(state.cursor.getFullYear());
    state.events.forEach(e => {
      const d = keyToDate(e.date);
      if (!isNaN(d)) years.add(d.getFullYear());
    });
    const yearOptions = Array.from(years).sort((a, b) => b - a).map(y =>
      `<option value="${y}"${y === year ? " selected" : ""}>${y}</option>`).join("");

    const evs = filteredEvents().filter(e => {
      const d = keyToDate(e.date);
      return d.getFullYear() === year;
    });

    const totalBatches = evs.length;
    const totalCand = sumCandidates(evs);

    const monthRows = MONTHS.map((name, m) => {
      const list = evs.filter(e => keyToDate(e.date).getMonth() === m);
      const bySchol = SCHOLARSHIPS.map(s => sumCandidates(list.filter(e => e.scholarship === s.name)));
      return {
        m, name,
        batches: list.length,
        cand: sumCandidates(list),
        bySchol,
        completed: list.filter(e => e.status === "Completed").length
      };
    });
    const maxMonthCand = Math.max(1, ...monthRows.map(r => r.cand));

    let html = `<div class="panel">
      <div class="panel-head">
        <h3>📈 Yearly Assessment Report</h3>
        <select id="yearSelect" aria-label="Select year">${yearOptions}</select>
        <span class="sub">${totalBatches} batch${totalBatches === 1 ? "" : "es"} · ${totalCand} candidate${totalCand === 1 ? "" : "s"} in ${year}</span>
      </div>
      <div class="table-wrap">
        <table class="data">
          <thead><tr>
            <th>Month</th>
            <th class="num">Batches</th>
            <th class="num">Candidates</th>
            ${SCHOLARSHIPS.map(s => `<th class="num">${esc(s.name)}</th>`).join("")}
            <th class="num">Completed</th>
            <th>Load</th>
          </tr></thead>
          <tbody>`;

    const now = new Date();
    monthRows.forEach(r => {
      const isCurrent = (now.getFullYear() === year && now.getMonth() === r.m);
      html += `<tr${isCurrent ? ' style="background:#f0fdf4"' : ''}>
        <td>${esc(r.name)}${isCurrent ? '<span class="now-badge">NOW</span>' : ""}</td>
        <td class="num">${r.batches || "—"}</td>
        <td class="num">${r.cand || "—"}</td>
        ${r.bySchol.map(c => `<td class="num">${c || "—"}</td>`).join("")}
        <td class="num">${r.completed || "—"}</td>
        <td style="min-width:100px">
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.cand / maxMonthCand * 100)}%;background:#059669"></div></div>
        </td>
      </tr>`;
    });

    const colTotals = SCHOLARSHIPS.map((s, i) => monthRows.reduce((a, r) => a + r.bySchol[i], 0));
    const totalCompleted = monthRows.reduce((a, r) => a + r.completed, 0);

    html += `</tbody>
        <tfoot><tr>
          <td>TOTAL ${year}</td>
          <td class="num">${totalBatches}</td>
          <td class="num">${totalCand}</td>
          ${colTotals.map(c => `<td class="num">${c}</td>`).join("")}
          <td class="num">${totalCompleted}</td>
          <td></td>
        </tr></tfoot>
      </table>
    </div>
  </div>`;

    const qualRows = QUALIFICATIONS.map(q => {
      const list = evs.filter(e => e.qualification === q.name);
      return { q, batches: list.length, cand: sumCandidates(list) };
    }).filter(x => x.batches > 0).sort((a, b) => b.cand - a.cand);

    if (qualRows.length) {
      html += `<div class="panel">
        <div class="panel-head">
          <h3>🏷️ Yearly Totals per Qualification — ${year}</h3>
          <span class="sub">${qualRows.length} qualification${qualRows.length === 1 ? "" : "s"} with scheduled batches</span>
        </div>
        <div class="table-wrap"><table class="data">
          <thead><tr>
            <th>Qualification</th>
            <th class="num">Batches</th>
            <th class="num">Candidates</th>
            <th class="num">Share</th>
          </tr></thead>
          <tbody>${qualRows.map(x => `<tr>
            <td>
              <span class="q-tag" style="background:${x.q.bg};color:${x.q.text};border-color:${x.q.color}">${esc(x.q.short)}</span>
              <span style="color:#64748b;font-size:11.5px;margin-left:8px">${esc(x.q.name)}</span>
            </td>
            <td class="num">${x.batches}</td>
            <td class="num">${x.cand}</td>
            <td class="num">${totalCand ? Math.round(x.cand / totalCand * 100) : 0}%</td>
          </tr>`).join("")}</tbody>
          <tfoot><tr>
            <td>TOTAL</td>
            <td class="num">${totalBatches}</td>
            <td class="num">${totalCand}</td>
            <td class="num">100%</td>
          </tr></tfoot>
        </table></div>
      </div>`;
    }

    return html;
  }

  /* =========================================================
     13. MONTHLY REPORT
     ========================================================= */
  function renderReports() {
    const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
    const monthLabel = state.cursor.toLocaleDateString("en-US", { month: "long", year: "numeric" });

    const evs = filteredEvents().filter(e => {
      const d = keyToDate(e.date);
      return d.getFullYear() === y && d.getMonth() === m;
    });

    if (!evs.length) {
      return emptyState("No assessments for " + monthLabel,
        "Navigate to another month or clear the active filters.");
    }

    const rows = QUALIFICATIONS.map(q => {
      const cells = SCHOLARSHIPS.map(s => sumCandidates(
        evs.filter(e => e.qualification === q.name && e.scholarship === s.name)
      ));
      const batches = evs.filter(e => e.qualification === q.name).length;
      return { q, cells, batches, total: cells.reduce((a, b) => a + b, 0) };
    }).filter(r => r.batches > 0);

    const colTotals = SCHOLARSHIPS.map((s, i) => rows.reduce((a, r) => a + r.cells[i], 0));
    const grand = colTotals.reduce((a, b) => a + b, 0);
    const grandBatches = rows.reduce((a, r) => a + r.batches, 0);

    const assessorMap = {};
    evs.forEach(e => {
      const k = e.assessor || "Unassigned";
      if (!assessorMap[k]) assessorMap[k] = { name: k, batches: 0, cand: 0 };
      assessorMap[k].batches++;
      assessorMap[k].cand += Number(e.candidates) || 0;
    });
    const assessors = Object.values(assessorMap).sort((a, b) => b.cand - a.cand);

    return `
    <div class="panel">
      <div class="panel-head">
        <h3>Monthly Assessment Report — ${esc(monthLabel)}</h3>
        <span class="sub">${grandBatches} batches · ${grand} candidates</span>
      </div>
      <div class="table-wrap">
        <table class="data">
          <thead><tr>
            <th>Qualification Program</th>
            ${SCHOLARSHIPS.map(s => `<th class="num">${esc(s.name)}</th>`).join("")}
            <th class="num">Total Candidates</th>
            <th class="num">Batches</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td><span class="q-tag" style="background:${r.q.bg};color:${r.q.text};border-color:${r.q.color}">${esc(r.q.short)}</span></td>
              ${r.cells.map(c => `<td class="num">${c || "—"}</td>`).join("")}
              <td class="num"><strong>${r.total}</strong></td>
              <td class="num">${r.batches}</td>
            </tr>`).join("")}
          </tbody>
          <tfoot><tr>
            <td>TOTAL</td>
            ${colTotals.map(c => `<td class="num">${c}</td>`).join("")}
            <td class="num">${grand}</td>
            <td class="num">${grandBatches}</td>
          </tr></tfoot>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Candidates per Assessor — ${esc(monthLabel)}</h3></div>
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Assessor</th><th class="num">Batches</th><th class="num">Candidates</th></tr></thead>
          <tbody>${assessors.map(a => `<tr>
            <td><strong>${esc(a.name)}</strong></td>
            <td class="num">${a.batches}</td>
            <td class="num">${a.cand}</td>
          </tr>`).join("")}</tbody>
          <tfoot><tr>
            <td>TOTAL</td>
            <td class="num">${grandBatches}</td>
            <td class="num">${grand}</td>
          </tr></tfoot>
        </table>
      </div>
    </div>`;
  }

  /* =========================================================
     14. RENDER ORCHESTRATION
     ========================================================= */
  function render() {
    const container = $("#viewContainer");

    if (state.tab === "calendar") {
      if (state.view === "month") container.innerHTML = renderMonth();
      else if (state.view === "week") container.innerHTML = renderWeek();
      else if (state.view === "day") container.innerHTML = renderDay();
      else container.innerHTML = renderList();
    } else if (state.tab === "dashboard") {
      container.innerHTML = renderDashboard();
    } else {
      container.innerHTML = renderReports();
    }

    updateChrome();
  }

  function periodText() {
    if (state.tab === "dashboard") return "All records (filtered)";
    if (state.tab === "reports") {
      return state.cursor.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    }
    switch (state.view) {
      case "month":
        return state.cursor.toLocaleDateString("en-US", { month: "long", year: "numeric" });
      case "week": {
        const s = startOfWeek(state.cursor), e = addDays(s, 6);
        return s.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " – " +
               e.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      }
      case "day":
        return state.cursor.toLocaleDateString("en-US", { weekday: "short", month: "long", day: "numeric", year: "numeric" });
      default:
        return "All scheduled assessments";
    }
  }

  function updateChrome() {
    $$(".tabbar button").forEach(b => {
      const on = b.dataset.tab === state.tab;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });

    $("#viewSwitch").hidden = state.tab !== "calendar";
    $("#datenav").hidden = state.tab === "dashboard";
    $("#legendSection").hidden = state.tab !== "calendar";

    $$("#viewSwitch button").forEach(b => {
      const on = b.dataset.view === state.view;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });

    $("#periodLabel").textContent = periodText();
    const noNav = state.tab === "dashboard" || (state.tab === "calendar" && state.view === "list");
    $("#btnPrev").disabled = noNav;
    $("#btnNext").disabled = noNav;
    $("#btnToday").disabled = noNav;

    const evs = filteredEvents();
    const cand = sumCandidates(evs);
    $("#stats").textContent =
      evs.length + " batch" + (evs.length === 1 ? "" : "es") + " · " +
      cand + " candidate" + (cand === 1 ? "" : "s");

    $("#printPeriod").textContent = periodText();
    $("#printDate").textContent = new Date().toLocaleString("en-US", {
      dateStyle: "medium", timeStyle: "short"
    });
  }

  /* =========================================================
     15. MODAL / FORM
     ========================================================= */
  function showModal() {
    $("#modalOverlay").hidden = false;
    document.body.style.overflow = "hidden";
    setTimeout(() => { $("#fDate").focus(); }, 40);
  }
  function closeModal() {
    $("#modalOverlay").hidden = true;
    document.body.style.overflow = "";
    editingId = null;
  }

  function openNew(dateKey) {
    editingId = null;
    $("#modalTitle").textContent = "New Assessment Entry";
    $("#fDate").value = dateKey || toKey(new Date());
    $("#fScholarship").value = SCHOLARSHIPS[0].name;
    $("#fQualification").value = QUALIFICATIONS[0].name;
    $("#fAssessor").value = "";
    $("#fCandidates").value = 1;
    $("#fRemarks").value = "";
    $("#fStatus").value = "Scheduled";
    $("#btnDelete").hidden = true;
    showModal();
  }

  function openEdit(id) {
    const entry = state.events.find(x => x.id === id);
    if (!entry) return;

    editingId = id;
    $("#modalTitle").textContent = "Edit Assessment Entry";
    $("#fDate").value = entry.date;
    $("#fScholarship").value = entry.scholarship;
    $("#fQualification").value = entry.qualification;
    $("#fAssessor").value = entry.assessor || "";
    $("#fCandidates").value = entry.candidates || 1;
    $("#fRemarks").value = entry.remarks || "";
    $("#fStatus").value = entry.status || "Scheduled";
    $("#btnDelete").hidden = false;
    showModal();
  }

  function handleSubmit(ev) {
    ev.preventDefault();

    const date = $("#fDate").value;
    const assessor = $("#fAssessor").value.trim();
    const candidates = Math.max(1, parseInt($("#fCandidates").value, 10) || 1);

    if (!date || !assessor) {
      toast("⚠ Please complete the date and assessor name.");
      return;
    }

    const payload = {
      date: date,
      scholarship: $("#fScholarship").value,
      qualification: $("#fQualification").value,
      assessor: assessor,
      candidates: candidates,
      remarks: $("#fRemarks").value.trim(),
      status: $("#fStatus").value
    };

    if (editingId) {
      const idx = state.events.findIndex(x => x.id === editingId);
      if (idx > -1) state.events[idx] = Object.assign({}, state.events[idx], payload);
      toast("✓ Assessment entry updated.");
    } else {
      state.events.push(Object.assign({ id: uid() }, payload));
      toast("✓ Assessment scheduled.");
    }

    persist();
    closeModal();
    refreshFilterOptions();
    render();
  }

  function handleDelete() {
    if (!editingId) return;
    if (!window.confirm("Delete this assessment entry? This cannot be undone.")) return;

    state.events = state.events.filter(x => x.id !== editingId);
    persist();
    closeModal();
    refreshFilterOptions();
    render();
    toast("Assessment entry deleted.");
  }

  function removeEntry(id) {
    const entry = state.events.find(x => x.id === id);
    if (!entry) return;
    if (!window.confirm("Delete this assessment entry? This cannot be undone.")) return;

    state.events = state.events.filter(x => x.id !== id);
    persist();
    refreshFilterOptions();
    render();
    toast("Assessment entry deleted.");
  }

  /* =========================================================
     16. SELECTS / LEGEND
     ========================================================= */
  function populateStaticSelects() {
    $("#fScholarship").innerHTML = SCHOLARSHIPS.map(s =>
      `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join("");

    $("#fQualification").innerHTML = QUALIFICATIONS.map(q =>
      `<option value="${esc(q.name)}">${esc(q.short)} — ${esc(q.name)}</option>`).join("");

    $("#fStatus").innerHTML = STATUSES.map(s =>
      `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join("");

    $("#fltScholarship").innerHTML = '<option value="">All scholarship types</option>' +
      SCHOLARSHIPS.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join("");

    $("#fltQualification").innerHTML = '<option value="">All qualifications</option>' +
      QUALIFICATIONS.map(q =>
        `<option value="${esc(q.name)}">${esc(q.short)} — ${esc(q.name)}</option>`).join("");

    $("#fltStatus").innerHTML = '<option value="">All statuses</option>' +
      STATUSES.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join("");
  }

  function refreshFilterOptions() {
    const assessors = Array.from(new Set(
      state.events.map(e => e.assessor).filter(Boolean)
    )).sort((a, b) => a.localeCompare(b));

    if (state.filters.assessor && assessors.indexOf(state.filters.assessor) === -1) {
      state.filters.assessor = "";
    }

    $("#fltAssessor").innerHTML = '<option value="">All assessors</option>' +
      assessors.map(a =>
        `<option value="${esc(a)}"${a === state.filters.assessor ? " selected" : ""}>${esc(a)}</option>`
      ).join("");

    $("#assessorList").innerHTML = assessors.map(a =>
      `<option value="${esc(a)}"></option>`).join("");
  }

  function buildLegend() {
    $("#qualLegend").innerHTML = '<span class="legend-title">Qualification</span>' +
      QUALIFICATIONS.map(q =>
        `<span class="legend-item">
          <span class="swatch" style="background:${q.bg};border:1px solid ${q.color}"></span>${esc(q.short)}
        </span>`).join("");
  }

  /* =========================================================
     17. EXPORT
     ========================================================= */
  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
  }

  function stamp() {
    const d = new Date();
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }

  function exportJSON() {
    const sorted = state.events.slice().sort((a, b) => a.date.localeCompare(b.date));
    download(
      "PTC-Calumpit-Assessment-Backup-" + stamp() + ".json",
      JSON.stringify(sorted, null, 2),
      "application/json"
    );
    toast("✓ JSON backup downloaded.");
  }

  function csvCell(v) {
    const s = String(v == null ? "" : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportExcel() {
    const rows = [[
      "Date", "Type of Scholarship", "Qualification Program",
      "Assessor Name", "Number of Candidates", "Status", "Remarks"
    ]];

    sortEvents(filteredEvents()).forEach(e => {
      rows.push([
        e.date, e.scholarship, e.qualification,
        e.assessor, e.candidates, e.status, e.remarks || ""
      ]);
    });

    const csv = rows.map(r => r.map(csvCell).join(",")).join("\r\n");
    download(
      "PTC-Calumpit-Assessment-Report-" + stamp() + ".csv",
      "\uFEFF" + csv,
      "text/csv;charset=utf-8;"
    );
    toast("✓ Excel (CSV) export downloaded.");
  }

  /* =========================================================
     18. PRINT
     ========================================================= */
  function doPrint() {
    state.printMode = true;
    render();
    setTimeout(() => { window.print(); }, 80);
  }
  window.addEventListener("afterprint", () => {
    if (state.printMode) { state.printMode = false; render(); }
  });

  /* =========================================================
     19. TOAST
     ========================================================= */
  function toast(message) {
    const el = $("#toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
  }

  /* =========================================================
     20. NAVIGATION
     ========================================================= */
  function shiftPeriod(dir) {
    if (state.tab === "reports" || state.view === "month") {
      state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + dir, 1);
    } else if (state.view === "week") {
      state.cursor = addDays(state.cursor, 7 * dir);
    } else if (state.view === "day") {
      state.cursor = addDays(state.cursor, dir);
    }
    render();
  }

  /* =========================================================
     21. EVENT WIRING
     ========================================================= */
  function wireEvents() {
    $("#btnNew").addEventListener("click", () => openNew());
    $("#btnSave").addEventListener("click", () => {
      persist();
      toast("✓ All assessment records saved locally.");
    });
    $("#btnPrint").addEventListener("click", doPrint);
    $("#btnPdf").addEventListener("click", () => {
      toast('In the print dialog, choose "Save as PDF" as the destination.');
      setTimeout(doPrint, 600);
    });
    $("#btnExcel").addEventListener("click", exportExcel);
    $("#btnJson").addEventListener("click", exportJSON);

    $$(".tabbar button").forEach(btn => {
      btn.addEventListener("click", () => {
        state.tab = btn.dataset.tab;
        render();
      });
    });

    $$("#viewSwitch button").forEach(btn => {
      btn.addEventListener("click", () => {
        state.view = btn.dataset.view;
        render();
      });
    });

    $("#btnPrev").addEventListener("click", () => shiftPeriod(-1));
    $("#btnNext").addEventListener("click", () => shiftPeriod(1));
    $("#btnToday").addEventListener("click", () => {
      state.cursor = new Date();
      render();
    });

    $("#fSearch").addEventListener("input", e => {
      state.filters.q = e.target.value;
      render();
    });
    $("#fltScholarship").addEventListener("change", e => {
      state.filters.scholarship = e.target.value; render();
    });
    $("#fltQualification").addEventListener("change", e => {
      state.filters.qualification = e.target.value; render();
    });
    $("#fltAssessor").addEventListener("change", e => {
      state.filters.assessor = e.target.value; render();
    });
    $("#fltStatus").addEventListener("change", e => {
      state.filters.status = e.target.value; render();
    });
    $("#fltFrom").addEventListener("change", e => {
      state.filters.from = e.target.value; render();
    });
    $("#fltTo").addEventListener("change", e => {
      state.filters.to = e.target.value; render();
    });
    $("#btnClearFilters").addEventListener("click", () => {
      state.filters = { scholarship: "", qualification: "", assessor: "", status: "", from: "", to: "", q: "" };
      $("#fSearch").value = "";
      $("#fltScholarship").value = "";
      $("#fltQualification").value = "";
      $("#fltAssessor").value = "";
      $("#fltStatus").value = "";
      $("#fltFrom").value = "";
      $("#fltTo").value = "";
      render();
      toast("Filters cleared.");
    });

    const view = $("#viewContainer");

    view.addEventListener("click", ev => {
      const del = ev.target.closest("[data-del]");
      if (del) { ev.stopPropagation(); removeEntry(del.dataset.del); return; }

      const editTarget = ev.target.closest("[data-id]");
      if (editTarget) { openEdit(editTarget.dataset.id); return; }

      const addTarget = ev.target.closest("[data-new]");
      if (addTarget) { openNew(addTarget.dataset.new); return; }

      const sortable = ev.target.closest("th[data-sort]");
      if (sortable) {
        const key = sortable.dataset.sort;
        if (state.sort.key === key) state.sort.dir *= -1;
        else { state.sort.key = key; state.sort.dir = 1; }
        render();
        return;
      }

      const cell = ev.target.closest(".cal-cell");
      if (cell) { openNew(cell.dataset.date); }
    });

    view.addEventListener("change", ev => {
      if (ev.target && ev.target.id === "yearSelect") {
        state.reportYear = parseInt(ev.target.value, 10) || new Date().getFullYear();
        render();
      }
    });

    view.addEventListener("keydown", ev => {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      const target = ev.target.closest(".cal-cell, .ev-card");
      if (!target) return;
      ev.preventDefault();
      if (target.dataset.id) openEdit(target.dataset.id);
      else if (target.dataset.date) openNew(target.dataset.date);
    });

    $("#entryForm").addEventListener("submit", handleSubmit);
    $("#btnDelete").addEventListener("click", handleDelete);
    $("#btnCancel").addEventListener("click", closeModal);
    $("#modalOverlay").addEventListener("click", ev => {
      if (ev.target === $("#modalOverlay")) closeModal();
    });
    document.addEventListener("keydown", ev => {
      if (ev.key === "Escape" && !$("#modalOverlay").hidden) closeModal();
    });
  }

  /* =========================================================
     22. BOOTSTRAP
     ========================================================= */
  function init() {
    state.events = loadData();
    populateStaticSelects();
    buildLegend();
    refreshFilterOptions();
    wireEvents();
    render();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
